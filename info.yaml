# Tiny Tapeout project information
project:
  title:        "JS-SoC"
  author:       "Steven Joshua, Swatish Subramanian"
  discord:      "Haffy"
  description:  "RISC-V based SoC with an APB master and memory-mapped peripherals"
  language:     "SystemVerilog"
  clock_hz:     50000000

  tiles: "3x2"

  top_module: "tt_um_haffynotfound_riscv_soc"

  source_files:
    - "adder.sv"
    - "alu.sv"
    - "alu_decoder.sv"
    - "apb_master.sv"
    - "apb_slave_pwm.sv"
    - "apb_slave_timer.sv"
    - "apb_slave_uart.sv"
    - "baud_rate.sv"
    - "bridge.sv"
    - "control_logic.sv"
    - "controller.sv"
    - "core.sv"
    - "d_ff.sv"
    - "datapath.sv"
    - "decoder_logic.sv"
    - "deserializer.sv"
    - "dmem.sv"
    - "extender.sv"
    - "fifo.sv"
    - "fifo_master.sv"
    - "imem.sv"
    - "main_decoder.sv"
    - "master.sv"
    - "mux_2.sv"
    - "mux_3.sv"
    - "normal.sv"
    - "pwm.sv"
    - "register_file.sv"
    - "serializer.sv"
    - "square.sv"
    - "timer.sv"
    - "top.sv"
    - "uart_rx.sv"
    - "uart_soc.sv"
    - "uart_tx.sv"
    - "project.sv"

pinout:
  # Inputs
  ui[0]: "PRDATA_SEL0"
  ui[1]: "PRDATA_SEL1"
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "PRDATA0"
  uo[1]: "PRDATA1"
  uo[2]: "PRDATA2"
  uo[3]: "PRDATA3"
  uo[4]: "PRDATA4"
  uo[5]: "PRDATA5"
  uo[6]: "PRDATA6"
  uo[7]: "PRDATA7"

  # Bidirectional pins
  uio[0]: "PWM"
  uio[1]: "TIMER1"
  uio[2]: "TIMER2"
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
